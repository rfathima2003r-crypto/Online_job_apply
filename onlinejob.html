<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Location Project</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #eef2f3;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 320px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .location-box {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        input[type="text"]:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Location Finder</h2>
        
        <div id="location-display" class="location-box">
            ඔබේ Location එක මෙතැන පෙන්වනු ඇත.
        </div>

        <form id="userForm">
            <input type="text" id="username" placeholder="ඔබේ නම ඇතුළත් කරන්න" required>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Submit කරද්දී Page එක Refresh වීම වළක්වයි

            const name = document.getElementById('username').value;
            const displayBox = document.getElementById('location-display');

            // Browser එකේ Geolocation Support කරනවාද බලයි
            if (navigator.geolocation) {
                displayBox.innerText = "Location ලබාගනිමින් පවතී...";

                // Location Permission ඉල්ලීම සහ Coordinate ලබාගැනීම
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        // Text එක විදියට Display එකේ පෙන්වීම
                        displayBox.innerText = `ආයුබෝවන් ${name}!\n\nඔබේ ස්ථානය:\nLatitude: ${lat}\nLongitude: ${lon}`;
                    },
                    function(error) {
                        // User 'Block' කළොත් හෝ Error එකක් ආවොත්
                        displayBox.innerText = "Location permission ලබාදීම ප්‍රතික්ෂේප විය.";
                    }
                );
            } else {
                displayBox.innerText = "ඔබගේ Browser එක මගින් Location සේවාව Support නොකරයි.";
            }
        });
    </script>

</body>
</html>
