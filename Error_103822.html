<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Google Cloud Free - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #202124;
        }
        .container {
            width: 100%;
            max-width: 460px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 40px 32px 36px;
            border: 1px solid #dadce0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        /* ===== LOGO ===== */
        .logo {
            margin-bottom: 20px;
        }
        .logo img {
            width: 90px;
            height: auto;
        }
        .logo .title {
            font-size: 22px;
            font-weight: 500;
            color: #202124;
            margin-top: 8px;
        }
        .logo .sub {
            font-size: 14px;
            color: #5f6368;
        }

        /* ===== ICONS ROW ===== */
        .icons-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 16px 0 20px;
            flex-wrap: wrap;
        }
        .icons-row .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #5f6368;
        }
        .icons-row .item .icon {
            font-size: 28px;
        }

        /* ===== ERROR MESSAGE ===== */
        .error-box {
            background: #fce8e6;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 16px 20px;
            margin: 20px 0 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }
        .error-box .icon {
            font-size: 24px;
            color: #d93025;
        }
        .error-box .text {
            flex: 1;
            font-size: 15px;
            color: #d93025;
            font-weight: 500;
            line-height: 1.4;
        }
        .error-box .close-btn {
            font-size: 18px;
            color: #5f6368;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.2s;
        }
        .error-box .close-btn:hover {
            color: #202124;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0 20px;
        }
        .divider .line {
            flex: 1;
            height: 1px;
            background: #dadce0;
        }
        .divider .text {
            font-size: 13px;
            color: #5f6368;
            white-space: nowrap;
        }

        /* ===== LINKS ===== */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }
        .links a {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            padding: 8px;
            border-radius: 4px;
        }
        .links a:hover {
            background: #f1f3f4;
            text-decoration: underline;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e8eaed;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #5f6368;
        }
        .footer a {
            color: #5f6368;
            text-decoration: none;
        }
        .footer a:hover {
            color: #1a73e8;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .card { padding: 24px 16px; }
            .logo img { width: 70px; }
            .logo .title { font-size: 18px; }
            .icons-row { gap: 12px; }
            .icons-row .item .icon { font-size: 22px; }
            .icons-row .item { font-size: 10px; }
            .error-box { padding: 12px 14px; }
            .error-box .text { font-size: 13px; }
            .links a { font-size: 13px; padding: 6px; }
            .footer { gap: 12px; font-size: 10px; }
        }
        @media (max-width: 360px) {
            .icons-row { gap: 8px; }
            .icons-row .item .icon { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <!-- ===== LOGO ===== -->
        <div class="logo">
            <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png" alt="Google">
            <div class="title">☁️ Google Cloud Free</div>
            <div class="sub">Sign in to continue to Cloud Console</div>
        </div>

        <!-- ===== ICONS ROW ===== -->
        <div class="icons-row">
            <div class="item">
                <span class="icon">📧</span>
                <span>Gmail</span>
            </div>
            <div class="item">
                <span class="icon">📁</span>
                <span>Drive</span>
            </div>
            <div class="item">
                <span class="icon">☁️</span>
                <span>Cloud</span>
            </div>
            <div class="item">
                <span class="icon">📅</span>
                <span>Calendar</span>
            </div>
            <div class="item">
                <span class="icon">📄</span>
                <span>Docs</span>
            </div>
            <div class="item">
                <span class="icon">💬</span>
                <span>Chat</span>
            </div>
        </div>

        <!-- ===== ERROR MESSAGE ===== -->
        <div class="error-box" id="errorBox">
            <span class="icon">⚠️</span>
            <span class="text">Your email or password is wrong. <strong>Try again.</strong></span>
            <span class="close-btn" onclick="hideError()">✕</span>
        </div>

        <!-- ===== DIVIDER ===== -->
        <div class="divider">
            <span class="line"></span>
            <span class="text">or</span>
            <span class="line"></span>
        </div>

        <!-- ===== LINKS ===== -->
        <div class="links">
            <a href="https://support.google.com/mail/answer/56256?hl=en">🔑 Create new account</a>
            <a href="https://support.google.com/accounts/answer/7682439?hl=en">🔄 Recover account</a>
            <a href="https://support.google.com/accounts/answer/27441?hl=en&co=GENIE.Platform%3DDesktop">❓ Need help?</a>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <a href="https://safety.google/intl/en_us/settings/">Privacy</a>
            <a href="https://safety.google/intl/en-GB_ALL/settings/security-settings/">Terms</a>
            <a href="https://myaccount.google.com/security">Security</a>
            <a href="https://support.google.com/accounts/answer/27441?hl=en&co=GENIE.Platform%3DDesktop">Help</a>
            <span>© 2026 Google</span>
        </div>

    </div>
</div>

<script>
    // =============================================
    // 🔥 FAKE ERROR PAGE - MR.D EDITION
    // =============================================

    function hideError() {
        document.getElementById('errorBox').style.display = 'none';
    }

    // Show error on page load with animation
    window.addEventListener('load', function() {
        const errorBox = document.getElementById('errorBox');
        errorBox.style.display = 'flex';
        errorBox.style.animation = 'fadeIn 0.5s ease';
    });

    // Click anywhere to show error again (optional)
    document.addEventListener('click', function(e) {
        const errorBox = document.getElementById('errorBox');
        // Only if clicking on the card (not on close button)
        if (e.target.closest('.card') && !e.target.closest('.close-btn')) {
            errorBox.style.display = 'flex';
            errorBox.style.animation = 'fadeIn 0.3s ease';
        }
    });

    console.log('🔥 Google Cloud Fake Error Page loaded!');
    console.log('📌 Error message: "Your email or password is wrong. Try again."');
</script>

</body>
</html>
